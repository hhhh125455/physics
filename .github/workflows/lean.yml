name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Reject unfinished proof placeholders
        run: |
          if grep -RnE '\b(sorry|admit)\b' --include='*.lean' .; then
            echo 'Unfinished proof placeholder detected'
            exit 1
          fi
