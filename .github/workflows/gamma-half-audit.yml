name: Gamma-half inner-family Lean audit

on:
  push:
    branches:
      - research/gamma-half-lean-audit-20261031
  pull_request:
    paths:
      - 'GammaHalf/**'
      - '.github/workflows/gamma-half-audit.yml'

jobs:
  formal-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib
        run: |
          lake update
          lake exe cache get
      - name: Compile black-hole inner-family audit
        run: lake env lean GammaHalf/InnerFamily.lean
      - name: Compile characteristic-corner calculus theorems
        run: lake env lean GammaHalf/CharacteristicCorner.lean
      - name: Compile local singular-corner rectangle theorem
        run: lake env lean GammaHalf/LocalRectangle.lean
      - name: Compile linear-area and coupled-leading balances
        run: lake env lean GammaHalf/LinearAreaBranch.lean
      - name: Compile exact finite-amplitude comparison identity
        run: lake env lean GammaHalf/AmplitudeDifference.lean
      - name: Compile homogeneous blowup rigidity theorem
        run: lake env lean GammaHalf/BlowupRigidity.lean
      - name: Compile exact charged-area counterfamilies
        run: lake env lean GammaHalf/AreaCounterfamilies.lean
      - name: Compile odd angular scalar boundary no-go
        run: lake env lean GammaHalf/OddAngularBoundary.lean
      - name: Compile full Einstein constraint obstruction
        run: lake env lean GammaHalf/FullConstraintObstruction.lean
      - name: Compile full coupled Einstein-scalar first variations
        run: lake env lean GammaHalf/CoupledFirstJets.lean
      - name: Compile initial constraint amplitude response
        run: lake env lean GammaHalf/InitialConstraintResponse.lean
      - name: Reject proof holes
        run: |
          if grep -RnE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' GammaHalf; then
            echo 'Unfinished proof placeholder detected'; exit 1
          fi
