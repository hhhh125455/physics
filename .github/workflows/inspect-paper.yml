name: Inspect original arXiv equations
on:
  push:
    paths:
      - '.github/workflows/inspect-paper.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract source PDF
        run: |
          set -e
          curl -LfS --retry 3 -A 'Mozilla/5.0 (academic research; math verification)' --max-time 90 https://arxiv.org/pdf/2610.38428 -o /tmp/paper.pdf
          file /tmp/paper.pdf
          pdftotext -layout /tmp/paper.pdf /tmp/paper.txt
          echo '===== PAGE BREAK LIST ====='
          grep -n -e $'\f' /tmp/paper.txt | head -40 || true
          echo '===== PAPER TEXT FIRST 700 LINES ====='
          sed -n '1,700p' /tmp/paper.txt
