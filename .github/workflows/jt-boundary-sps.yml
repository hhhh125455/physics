name: JT action-derived boundary phase space
on:
  push:
    branches: [research/jt-boundary-sps-20261101]
    paths:
      - ClassicalSpinKrylov/JTBoundarySPS.lean
      - .github/workflows/jt-boundary-sps.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Check JT symplectic reconstruction
        run: lake env lean ClassicalSpinKrylov/JTBoundarySPS.lean
      - name: Reject proof placeholders and extra local axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)([[:space:]]|$)' ClassicalSpinKrylov/JTBoundarySPS.lean; then exit 1; fi
